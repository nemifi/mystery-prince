name: Validate contracts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate_contracts.py
      - run: python tools/compile_realizations.py --write-dir build/realizations
      - run: python tools/runtime_v1.py --auto build/realizations/*.json
      - run: python tools/validate_prototype.py
      - run: python tools/prototype_metrics.py
      - run: node --check prototype/app.js
      - run: node --check prototype/test-tools.js
